<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subjects | Digittence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h2>Manage Subjects</h2>

    <!-- Add Subject -->
    <form action="/add_subject" method="POST">
        <input type="text" name="subjectName" placeholder="Subject Name" required>
        <button type="submit">Add Subject</button>
    </form>

    <br><br>

    <!-- Display Subjects -->
    <table border="1">
        <tr>
            <th>Subject Name</th>
        </tr>

        {% for s in subjects %}
        <tr>
            <td>
                <a href="/attendence.html">
                    {{ s }}
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
